<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1c1c1c" />
  <meta name="color-scheme" content="dark" />
  <title>maps-mipho</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="btn-freehand">Freehand</button>
      <button id="btn-undo" disabled>Undo</button>
      <button id="btn-clear" disabled>Clear</button>
      <div id="export-group">
        <button id="btn-export" disabled>Export</button>
        <div id="export-menu" class="hidden">
          <button id="btn-gpx">GPX</button>
          <button id="btn-kml">KML</button>
        </div>
      </div>
    </div>
    <div id="map"></div>
    <div id="profile-container">
      <div id="profile-toggle">Elevation Profile</div>
      <div id="profile-body">
        <dl id="stats">
          <div class="stat">
            <dt>Distance</dt>
            <dd id="stat-distance">0.0 km</dd>
          </div>
          <div class="stat">
            <dt>Ascent</dt>
            <dd id="stat-gain">+0 m</dd>
          </div>
          <div class="stat">
            <dt>Descent</dt>
            <dd id="stat-loss">-0 m</dd>
          </div>
          <div class="stat" title="Naismith's rule: 5 km/h plus 1 h per 600 m of ascent">
            <dt>Time</dt>
            <dd id="stat-time">0 min</dd>
          </div>
        </dl>
        <div id="profile-chart">
          <canvas id="profile-canvas"></canvas>
          <div id="profile-status" class="hidden" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
